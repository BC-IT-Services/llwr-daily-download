name: Docker Image CI

# Two ways in:
#   * Run this workflow (pick a branch, pick patch/minor/major) - it works out
#     the next version itself, tags the commit, and builds it. No copying the
#     current version out of the packages page first.
#   * Push a v* tag by hand - that tag is built as-is.
#
# Every build is also tagged with its short commit sha, so an iterative change
# can be deployed without minting a version number at all.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: "Work out the version and build, but do not tag or push"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needs to push the version tag it creates
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags, or the next version cannot be worked out.
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail

          # ghcr rejects uppercase image names; github.repository keeps the
          # original casing, so lowercase it explicitly.
          image="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
            echo "Triggered by tag push - building ${version} as-is."
          else
            # Highest existing version across the whole repo, not just this
            # branch: several branches publish to one package, and scoping per
            # branch would let them mint the same number twice.
            # Strict vN.N.N only. git's -l takes an fnmatch glob, so a pattern
            # like 'v[0-9]*.[0-9]*.[0-9]*' also matches v2.0.0-rc1 - and the
            # shell would then evaluate the patch as $((0-rc1 + 1)) == 1,
            # silently minting a wrong version. Filter with a real regex.
            latest="$(git tag -l 'v*' --sort=-v:refname \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                      | head -n1 || true)"
            if [ -z "${latest}" ]; then
              latest="v0.0.0"
              echo "No version tags yet - starting from ${latest}."
            fi

            core="${latest#v}"
            major="$(echo "${core}" | cut -d. -f1)"
            minor="$(echo "${core}" | cut -d. -f2)"
            patch="$(echo "${core}" | cut -d. -f3)"

            case "${{ inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac

            version="v${major}.${minor}.${patch}"
            echo "Latest was ${latest}, ${{ inputs.bump }} bump gives ${version}."
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Guard against reusing a version
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::error::Tag ${{ steps.version.outputs.version }} already exists. Someone tagged it between the version being worked out and now - re-run this workflow."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the commit
        # Only after a successful build, so a failed build never burns a
        # version number. Pushed with GITHUB_TOKEN, which by design does not
        # trigger another workflow run - no double build.
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "Release ${{ steps.version.outputs.version }} from ${{ github.ref_name }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Summary
        if: always() && steps.version.outputs.version != ''
        run: |
          {
            echo "## ${{ steps.version.outputs.version }}"
            echo
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "> Dry run - nothing was pushed or tagged."
              echo
            fi
            echo "Paste into Portainer:"
            echo
            echo '```'
            echo "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
            echo '```'
            echo
            echo "Or deploy this exact commit without minting a version:"
            echo
            echo '```'
            echo "${{ steps.version.outputs.image }}:sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
